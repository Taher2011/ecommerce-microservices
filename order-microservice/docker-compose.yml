version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres-${ENV}
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
    ports:
      - "${SPRING_DATASOURCE_PORT}:${SPRING_DATASOURCE_PORT}"
    volumes:
      - postgres_data_${ENV}:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-${ENV}
    ports:
      - "${SPRING_DATA_REDIS_PORT}:${SPRING_DATA_REDIS_PORT}"

  order-service:
    image: order-service:${IMAGE_TAG}
    container_name: order-${ENV}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env.${ENV}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SPRING_DATASOURCE_DB}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      LOGGING_FILE_PATH: ${LOGGING_FILE_PATH}
    volumes:
      - ./logs:${LOGGING_FILE_PATH}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data_dev:
  postgres_data_stage:

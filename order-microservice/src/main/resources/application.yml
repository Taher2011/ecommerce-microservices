server:
  port: 8080

logging:
  config: classpath:logback-spring.xml

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibenate:
        default:
          schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}

management:
 endpoints:
  web:
   base-path: /api/actuator
   exposure:
    include: "*"

aws:
  s3:
    region: ${AWS_REGION}
    bucket-name: ${AWS_S3_BUCKET-NAME}